// Simple retro sound effects
const playSound = (type) => {
  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const oscillator = audioContext.createOscillator();
  const gainNode = audioContext.createGain();
  
  oscillator.connect(gainNode);
  gainNode.connect(audioContext.destination);
  
  gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
  
  switch(type) {
    case 'collect':
      oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(783.99, audioContext.currentTime + 0.1);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.2);
      break;
    case 'hit':
      oscillator.frequency.setValueAtTime(100, audioContext.currentTime);
      oscillator.type = 'sawtooth';
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.3);
      break;
    case 'swim':
      oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
      oscillator.frequency.setValueAtTime(150, audioContext.currentTime + 0.05);
      oscillator.type = 'sine';
      gainNode.gain.setValueAtTime(0.05, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.1);
      break;
  }
};

  // Robuster CSV Parser für mehrzeilige Felder mit UTF-8 BOM Handling
  const parseCSV = (text) => {
    // UTF-8 BOM entfernen falls vorhanden
    let cleanText = text;
    if (cleanText.charCodeAt(0) === 0xFEFF) {
      cleanText = cleanText.slice(1);
    }
    // Windows/Mac Zeilenenden normalisieren
    cleanText = cleanText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    
    const rows = [];
    let currentRow = [];
    let currentField = '';
    let inQuotes = false;
    
    for (let i = 0; i < cleanText.length; i++) {
      const char = cleanText[i];
      const nextChar = cleanText[i + 1];
      
      if (inQuotes) {
        if (char === '"') {
          if (nextChar === '"') {
            // Escaped quote
            currentField += '"';
            i++;
          } else {
            // End of quoted field
            inQuotes = false;
          }
        } else {
          currentField += char;
        }
      } else {
        if (char === '"') {
          inQuotes = true;
        } else if (char === ',') {
          currentRow.push(currentField.trim());
          currentField = '';
        } else if (char === '\n') {
          if (currentField || currentRow.length > 0) {
            currentRow.push(currentField.trim());
            if (currentRow.some(f => f)) {
              rows.push(currentRow);
            }
            currentRow = [];
            currentField = '';
          }
        } else {
          currentField += char;
        }
      }
    }
    
    // Letzte Zeile hinzufügen
    if (currentField || currentRow.length > 0) {
      currentRow.push(currentField.trim());
      if (currentRow.some(f => f)) {
        rows.push(currentRow);
      }
    }
    
    return rows;
  };

      const limit = 5 * 1024 * 1024; // 5MB
      return { used, limit, available: limit - used, percentUsed: Math.round((used / limit) * 100) };
    } catch {
      return { used: 0, limit: 5242880, available: 5242880, percentUsed: 0 };
    }
  };

            typedText = row[4] || '';
            ownExplanation = '';
          } else if (row.length >= 3) {
            // 3-Spalten Format: id, german, english ODER german, english, extra
            if (!isNaN(parseInt(row[0])) || row[0].length < 10) {
              id = parseInt(row[0]) || (index + 1);
              german = row[1] || '';
              english = row[2] || '';
            } else {
              id = index + 1;
              german = row[0] || '';
              english = row[1] || '';
            }
            thrownBackCount = 0;
            typedText = '';
            ownExplanation = '';
          } else {

            english = row[1] || '';
            thrownBackCount = 0;
            typedText = '';
            ownExplanation = '';

        }).filter(card => card !== null);

      }
    };

                <button onClick={()=>setCardFlipped(!cardFlipped)} style={{padding:'16px 40px',background:GBA_COLORS.orange,color:GBA_COLORS.white,border:`3px solid ${GBA_COLORS.black}`,cursor:'pointer',fontFamily:'inherit',fontSize:'0.6rem',fontWeight:'bold'}}>{t.flipBtn}</button>
                <button onClick={throwBackCard} style={{padding:'16px 40px',background:(currentCard.thrownBackCount || 0) >= 2 ? GBA_COLORS.chestPurple : GBA_COLORS.chestOrange,color:GBA_COLORS.white,border:`3px solid ${GBA_COLORS.black}`,cursor:'pointer',fontFamily:'inherit',fontSize:'0.6rem',fontWeight:'bold'}}>{t.throwBackBtn}</button>
              </div>
            </div>
          </div>
        )}

        {currentHouse && (
          <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:GBA_COLORS.uiOverlay,display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:'20px'}}>
            <div style={{background:GBA_COLORS.uiDark,border:`4px solid ${GBA_COLORS.black}`,padding:'40px',maxWidth:'700px',maxHeight:'90vh',width:'100%',color:GBA_COLORS.white,display:'flex',flexDirection:'column'}}>
              <h2 style={{fontSize:'0.65rem',marginBottom:'20px',color:GBA_COLORS.chestGold}}>{currentHouse.name}</h2>
              <div ref={houseScrollRef} style={{height:'calc(90vh - 250px)',overflowY:'auto',overflowX:'hidden',paddingRight:'15px'}}>
                <p style={{fontSize:'0.45rem',lineHeight:'1.7',paddingBottom:'20px',whiteSpace:'pre-wrap'}}>
                  {currentHouse.text}
                </p>
              </div>
              <div style={{display:'flex',gap:'12px',flexWrap:'wrap',marginTop:'15px'}}>
                <button onClick={()=>speak(currentHouse.name+'. '+currentHouse.text)} style={{padding:'14px 28px',background:GBA_COLORS.playerBlue,color:GBA_COLORS.white,border:`3px solid ${GBA_COLORS.black}`,cursor:'pointer',fontFamily:'inherit',fontSize:'0.52rem'}}>{t.readAloudBtn}</button>
                <button onClick={()=>{stopSpeech();setCurrentHouse(null);houseClosedTime.current = Date.now();}} style={{padding:'14px 28px',background:GBA_COLORS.uiDark,color:GBA_COLORS.white,border:`3px solid ${GBA_COLORS.black}`,cursor:'pointer',fontFamily:'inherit',fontSize:'0.52rem'}}>{t.close} (X)</button>
              </div>
            </div>
          </div>
        )}

        {/* Touch Controls */}
        {showTouchControls && !currentCard && !currentHouse && (
          <div style={{position:'absolute',bottom:'80px',left:'20px',zIndex:20,userSelect:'none'}}>
            <div style={{display:'grid',gridTemplateColumns:'45px 45px 45px',gridTemplateRows:'45px 45px 45px',gap:'2px'}}>
              <div/>
              <button 
                onTouchStart={(e)=>{e.preventDefault();keysPressed.current['ArrowUp']=true;}} 
                onTouchEnd={(e)=>{e.preventDefault();keysPressed.current['ArrowUp']=false;}}
                onTouchCancel={()=>{keysPressed.current['ArrowUp']=false;}}
                onMouseDown={()=>{keysPressed.current['ArrowUp']=true;}}
                onMouseUp={()=>{keysPressed.current['ArrowUp']=false;}}
                onMouseLeave={()=>{keysPressed.current['ArrowUp']=false;}}
                style={{background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',cursor:'pointer',touchAction:'none',fontSize:'16px',color:'rgba(255,255,255,0.2)'}}>▲</button>
              <div/>
              <button 
                onTouchStart={(e)=>{e.preventDefault();keysPressed.current['ArrowLeft']=true;}}
                onTouchEnd={(e)=>{e.preventDefault();keysPressed.current['ArrowLeft']=false;}}
                onTouchCancel={()=>{keysPressed.current['ArrowLeft']=false;}}
                onMouseDown={()=>{keysPressed.current['ArrowLeft']=true;}}
                onMouseUp={()=>{keysPressed.current['ArrowLeft']=false;}}
                onMouseLeave={()=>{keysPressed.current['ArrowLeft']=false;}}
                style={{background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',cursor:'pointer',touchAction:'none',fontSize:'16px',color:'rgba(255,255,255,0.2)'}}>◀</button>
              <div/>
              <button 
                onTouchStart={(e)=>{e.preventDefault();keysPressed.current['ArrowRight']=true;}}
                onTouchEnd={(e)=>{e.preventDefault();keysPressed.current['ArrowRight']=false;}}
                onTouchCancel={()=>{keysPressed.current['ArrowRight']=false;}}
                onMouseDown={()=>{keysPressed.current['ArrowRight']=true;}}
                onMouseUp={()=>{keysPressed.current['ArrowRight']=false;}}
                onMouseLeave={()=>{keysPressed.current['ArrowRight']=false;}}
                style={{background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',cursor:'pointer',touchAction:'none',fontSize:'16px',color:'rgba(255,255,255,0.2)'}}>▶</button>
              <div/>
              <button 
                onTouchStart={(e)=>{e.preventDefault();keysPressed.current['ArrowDown']=true;}}
                onTouchEnd={(e)=>{e.preventDefault();keysPressed.current['ArrowDown']=false;}}
                onTouchCancel={()=>{keysPressed.current['ArrowDown']=false;}}
                onMouseDown={()=>{keysPressed.current['ArrowDown']=true;}}
                onMouseUp={()=>{keysPressed.current['ArrowDown']=false;}}
                onMouseLeave={()=>{keysPressed.current['ArrowDown']=false;}}
                style={{background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',cursor:'pointer',touchAction:'none',fontSize:'16px',color:'rgba(255,255,255,0.2)'}}>▼</button>
              <div/>
            </div>
          </div>
        )}
        {showTouchControls && !currentCard && !currentHouse && (
          <button 
            onClick={()=>setGameState('menu')}
            style={{position:'absolute',top:'65px',right:'15px',zIndex:20,padding:'8px 12px',background:'rgba(0,0,0,0.5)',border:'none',borderRadius:'0',color:'#ff7e00',fontSize:'clamp(0.35rem,1.2vw,0.45rem)',fontFamily:'inherit',cursor:'pointer'}}>MENU</button>
        )}

        <style>{`
          @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
          body,html{margin:0;padding:0;overflow:hidden;}
          button:hover{filter:brightness(1.1);}
          button:active{transform:translateY(2px);}
          
          /* Beautiful green scrollbar */
          *::-webkit-scrollbar {
            width: 12px;
          }
          *::-webkit-scrollbar-track {
            background: #2d2d2d;
            border-radius: 0px;
          }
          *::-webkit-scrollbar-thumb {
            background: #4A7C59;
            border-radius: 6px;
            border: 2px solid #2d2d2d;
          }
          *::-webkit-scrollbar-thumb:hover {
            background: #5A8C69;
          }
          
          /* Firefox scrollbar */
          * {
            scrollbar-width: thin;
            scrollbar-color: #4A7C59 #2d2d2d;
          }
        `}</style>
      </div>
    );
  }

  // Reset function
  const resetCardState = () => {
    if (window.confirm(t.confirmResetCards)) {
      const resetCards = vocabularyCards.map(card => ({
        ...card,
        thrownBackCount: 0,
        typedText: '',
        ownExplanation: ''
      }));
      setVocabularyCards(resetCards);
      localStorage.setItem('vocabCards', JSON.stringify(resetCards));
      
      // Also reset chest completion status
      setChests(prevChests => prevChests.map(chest => ({
        ...chest,
        completed: false,
        found: false
      })));
    }
  };

  const resetWorld = () => {
    if (window.confirm(t.confirmReset)) {
      setPlayer({ x: 40*32+16, y: 40*32+16, dir: 'down', speed: 2.5, lives: 3, swimming: false });
      setPlayerAppearance(randomizeAppearance());
      setFoundCards([]);
      setWorld([]);
      setChests([]);
      setFrogs([]);
      setCrocodiles([]);
      setHouses([]);
      setIslands([]);
      
      // Reset learning progress on all cards
      const resetCards = vocabularyCards.map(card => ({
        ...card,
        thrownBackCount: 0,
        typedText: '',
        ownExplanation: ''
      }));
      setVocabularyCards(resetCards);
      localStorage.setItem('vocabCards', JSON.stringify(resetCards));
    }
  };

  // Get current preview card
  const currentPreviewCard = vocabularyCards.length > 0 ? vocabularyCards[previewCardIndex % vocabularyCards.length] : null;
  const nextPreviewCard = () => setPreviewCardIndex((previewCardIndex + 1) % Math.max(1, vocabularyCards.length));

  return (
    <div style={{fontFamily:"'Press Start 2P',monospace",background:'linear-gradient(180deg, #1a0f08 0%, #2d1a0d 50%, #1a0f08 100%)',minHeight:'100vh',color:'#fff8f0'}}>
      
      {/* ========== MENU STATE ========== */}
      {gameState === 'menu' && (
        <div style={{minHeight:'100vh',display:'grid',gridTemplateRows:'auto 1fr auto',padding:'clamp(15px,3vw,40px)',gap:'clamp(15px,2vw,25px)',maxWidth:'800px',margin:'0 auto',boxSizing:'border-box'}}>
          
          {/* Header */}
          <header style={{textAlign:'center',paddingTop:'clamp(5px,1vw,10px)'}}>
            <p style={{fontSize:'clamp(0.4rem,1.2vw,0.6rem)',color:'#8a7a6a',letterSpacing:'clamp(2px,0.5vw,4px)',marginBottom:'clamp(8px,1.5vw,15px)'}}>{t.welcomeTo}</p>
            <h1 style={{fontSize:'clamp(1.5rem,5vw,3rem)',color:'#ff7e00',margin:0,fontWeight:'normal',letterSpacing:'clamp(1px,0.3vw,3px)'}}>NEUROPLANT</h1>
          </header>
          
          {/* Main Content */}
          <main style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'clamp(15px,2.5vw,30px)',justifyContent:'flex-start',paddingTop:'clamp(5px,1vw,15px)'}}>
            
            {/* Character in Glow Circle */}
            <div style={{position:'relative',width:'clamp(80px,15vw,130px)',height:'clamp(80px,15vw,130px)'}}>
              <div style={{position:'absolute',top:'50%',left:'50%',width:'150%',height:'150%',background:'radial-gradient(circle, rgba(255,126,0,0.25) 0%, transparent 70%)',transform:'translate(-50%,-50%)',pointerEvents:'none'}}/>
              <div style={{width:'100%',height:'100%',background:'linear-gradient(135deg, #ff7e00 0%, #cc5500 100%)',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 0 clamp(20px,4vw,40px) rgba(255,126,0,0.4)'}}>
                <div style={{position:'relative',width:'60%',height:'75%'}}>
                  <div style={{position:'absolute',top:'0%',left:'34%',width:'32%',height:'12%',background:playerAppearance.mohawk}}/>
                  <div style={{position:'absolute',top:'10%',left:'38%',width:'24%',height:'9%',background:playerAppearance.mohawk}}/>
                  <div style={{position:'absolute',top:'17%',left:'42%',width:'16%',height:'8%',background:playerAppearance.mohawk}}/>
                  <div style={{position:'absolute',top:'24%',left:'26%',width:'48%',height:'28%',background:playerAppearance.skin,borderRadius:'20% 20% 0 0'}}/>
                  <div style={{position:'absolute',top:'36%',left:'36%',width:'10%',height:'8%',background:'#000'}}/>
                  <div style={{position:'absolute',top:'36%',left:'54%',width:'10%',height:'8%',background:'#000'}}/>
                  <div style={{position:'absolute',top:'52%',left:'22%',width:'56%',height:'28%',background:playerAppearance.shirt,borderRadius:'4px'}}/>
                  <div style={{position:'absolute',top:'56%',left:'8%',width:'16%',height:'20%',background:playerAppearance.skin,borderRadius:'3px'}}/>
                  <div style={{position:'absolute',top:'56%',left:'76%',width:'16%',height:'20%',background:playerAppearance.skin,borderRadius:'3px'}}/>
                  <div style={{position:'absolute',top:'80%',left:'30%',width:'16%',height:'20%',background:'#191970',borderRadius:'0 0 3px 3px'}}/>
                  <div style={{position:'absolute',top:'80%',left:'54%',width:'16%',height:'20%',background:'#191970',borderRadius:'0 0 3px 3px'}}/>
                </div>
              </div>
            </div>
            
            {/* Card Preview */}
            {currentPreviewCard && (
              <div 
                onClick={nextPreviewCard}
                style={{
                  background:'linear-gradient(145deg, #3d2a1a 0%, #2a1c12 100%)',
                  border:'3px solid #5a4030',
                  padding:'clamp(15px,3vw,25px)',
                  width:'90%',
                  maxWidth:'400px',
                  textAlign:'center',
                  cursor:'pointer',
                  boxShadow:'0 clamp(4px,1vw,8px) clamp(15px,3vw,25px) rgba(0,0,0,0.4)'
                }}>
                <div style={{fontSize:'clamp(0.35rem,1vw,0.5rem)',color:'#ff7e00',marginBottom:'clamp(8px,1.5vw,15px)',letterSpacing:'2px'}}>{t.yourCard}</div>
                <div style={{fontSize:'clamp(0.45rem,1.4vw,0.7rem)',color:'#fff8f0',lineHeight:'1.8',minHeight:'clamp(40px,8vw,80px)',display:'flex',alignItems:'center',justifyContent:'center'}}>{currentPreviewCard.german}</div>
                <div style={{marginTop:'clamp(10px,2vw,18px)',fontSize:'clamp(0.28rem,0.85vw,0.4rem)',color:'#6a5a4a'}}>{t.tapForAnother}</div>
              </div>
            )}
            
            {/* Buttons Grid */}
            <div style={{width:'90%',maxWidth:'400px',display:'flex',flexDirection:'column',gap:'clamp(10px,1.5vw,15px)'}}>
              {world.length > 0 ? (
                <button onClick={()=>setGameState('game')} style={{width:'100%',padding:'clamp(14px,2.5vw,22px)',fontSize:'clamp(0.5rem,1.5vw,0.8rem)',background:'#ff7e00',color:'#1a0f08',border:'none',cursor:'pointer',fontFamily:'inherit',fontWeight:'bold'}}>{t.continue}</button>
              ) : (
                <button onClick={()=>{setGameState('game');setFoundCards([]);setWorld([]);setChests([]);}} style={{width:'100%',padding:'clamp(14px,2.5vw,22px)',fontSize:'clamp(0.5rem,1.5vw,0.8rem)',background:'#ff7e00',color:'#1a0f08',border:'none',cursor:'pointer',fontFamily:'inherit',fontWeight:'bold'}}>{t.startLearning}</button>
              )}
              
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'clamp(8px,1.2vw,12px)'}}>
                <button onClick={()=>setGameState('cms')} style={{padding:'clamp(12px,2vw,18px)',fontSize:'clamp(0.38rem,1.1vw,0.55rem)',background:'#3d2a1a',color:'#ff7e00',border:'2px solid #5a4030',cursor:'pointer',fontFamily:'inherit'}}>{t.manageCards}</button>
                <button onClick={()=>setShowControls(true)} style={{padding:'clamp(12px,2vw,18px)',fontSize:'clamp(0.38rem,1.1vw,0.55rem)',background:'#3d2a1a',color:'#ff7e00',border:'2px solid #5a4030',cursor:'pointer',fontFamily:'inherit'}}>{t.controls}</button>
              </div>
              
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'clamp(8px,1.2vw,12px)'}}>
                <button onClick={()=>setLanguage(language==='de'?'en':'de')} style={{padding:'clamp(10px,1.5vw,14px)',fontSize:'clamp(0.32rem,0.95vw,0.48rem)',background:'#2a1c12',color:'#8a7a6a',border:'1px solid #4a3020',cursor:'pointer',fontFamily:'inherit'}}>{t.language}: {language.toUpperCase()}</button>
                <button onClick={()=>setShowTouchControls(!showTouchControls)} style={{padding:'clamp(10px,1.5vw,14px)',fontSize:'clamp(0.32rem,0.95vw,0.48rem)',background:showTouchControls?'#4a3520':'#2a1c12',color:'#8a7a6a',border:'1px solid #4a3020',cursor:'pointer',fontFamily:'inherit'}}>{t.touchControls}: {showTouchControls?t.on:t.off}</button>
              </div>
              
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'clamp(8px,1.2vw,12px)'}}>
                <button onClick={()=>setShowThinkers(!showThinkers)} style={{padding:'clamp(10px,1.5vw,14px)',fontSize:'clamp(0.32rem,0.95vw,0.48rem)',background:showThinkers?'#4a3520':'#2a1c12',color:'#8a7a6a',border:'1px solid #4a3020',cursor:'pointer',fontFamily:'inherit'}}>{t.showThinkers}: {showThinkers?t.on:t.off}</button>
                <button onClick={()=>setShuffleThinkers(!shuffleThinkers)} style={{padding:'clamp(10px,1.5vw,14px)',fontSize:'clamp(0.32rem,0.95vw,0.48rem)',background:shuffleThinkers?'#4a3520':'#2a1c12',color:'#8a7a6a',border:'1px solid #4a3020',cursor:'pointer',fontFamily:'inherit'}}>{t.shuffleThinkers}: {shuffleThinkers?t.on:t.off}</button>
              </div>
              
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'clamp(8px,1.2vw,12px)'}}>
                <button onClick={resetCardState} style={{padding:'clamp(10px,1.5vw,14px)',fontSize:'clamp(0.32rem,0.95vw,0.48rem)',background:'#2a1c12',color:'#aa5a4a',border:'1px solid #5a3a30',cursor:'pointer',fontFamily:'inherit'}}>{t.resetCards}</button>
                <button onClick={resetWorld} style={{padding:'clamp(10px,1.5vw,14px)',fontSize:'clamp(0.32rem,0.95vw,0.48rem)',background:'#2a1c12',color:'#aa5a4a',border:'1px solid #5a3a30',cursor:'pointer',fontFamily:'inherit'}}>{t.reset}</button>
              </div>
            </div>
          </main>
          
          {/* Footer */}
          <footer style={{textAlign:'center',paddingBottom:'clamp(10px,2vw,20px)'}}>
            <p style={{fontSize:'clamp(0.3rem,0.9vw,0.45rem)',color:'#5a4a3a',marginBottom:'clamp(8px,1vw,12px)'}}>{t.exploreLearnGrow}</p>
            <p style={{fontSize:'clamp(0.32rem,1vw,0.5rem)',color:'#7a6a5a'}}>{t.aLearningGameBy} <a href="https://www.mariusmichusch.de" target="_blank" rel="noopener noreferrer" style={{color:'#ff7e00',textDecoration:'none'}}>Marius Michusch</a></p>
            <p style={{fontSize:'clamp(0.25rem,0.7vw,0.35rem)',color:'#4a3a2a',marginTop:'clamp(6px,1vw,10px)'}}>{t.version} 2.0</p>
          </footer>
        </div>
      )}
      
      {/* Controls Modal */}
      {showControls && (
        <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,0.9)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:'clamp(15px,3vw,30px)'}} onClick={()=>setShowControls(false)}>
          <div style={{background:'linear-gradient(145deg, #2d1a0d 0%, #1a0f08 100%)',border:'3px solid #ff7e00',padding:'clamp(20px,4vw,35px)',maxWidth:'500px',width:'100%',maxHeight:'80vh',overflowY:'auto'}} onClick={e=>e.stopPropagation()}>
            <h2 style={{color:'#ff7e00',fontSize:'clamp(0.5rem,1.5vw,0.75rem)',marginBottom:'clamp(15px,2.5vw,25px)',textAlign:'center'}}>{t.controls}</h2>
            <div style={{fontSize:'clamp(0.35rem,1vw,0.5rem)',color:'#fff8f0',lineHeight:'2.2'}}>
              <p style={{marginBottom:'clamp(6px,1vw,10px)'}}>{t.move}</p>
              <p style={{marginBottom:'clamp(6px,1vw,10px)'}}>{t.flip}</p>
              <p style={{marginBottom:'clamp(6px,1vw,10px)'}}>{t.learned}</p>
              <p style={{marginBottom:'clamp(6px,1vw,10px)'}}>{t.throwBack}</p>
              <p style={{marginBottom:'clamp(6px,1vw,10px)'}}>{t.readAloud}</p>
              <p>{t.toMenu}</p>
            </div>
            <button onClick={()=>setShowControls(false)} style={{width:'100%',marginTop:'clamp(20px,3vw,30px)',padding:'clamp(12px,2vw,18px)',fontSize:'clamp(0.4rem,1.2vw,0.55rem)',background:'#ff7e00',color:'#1a0f08',border:'none',cursor:'pointer',fontFamily:'inherit'}}>OK</button>
          </div>
        </div>
      )}

      {/* ========== CMS STATE ========== */}
      {gameState === 'cms' && (
        <div style={{padding:'clamp(15px,3vw,30px)',maxWidth:'1000px',margin:'0 auto',minHeight:'100vh',boxSizing:'border-box'}}>
          <header style={{display:'flex',flexWrap:'wrap',gap:'clamp(10px,2vw,20px)',alignItems:'center',marginBottom:'clamp(15px,2.5vw,25px)'}}>
            <button onClick={()=>{setGameState('menu');setCmsTab('cards');}} style={{padding:'clamp(10px,2vw,16px) clamp(15px,3vw,24px)',fontSize:'clamp(0.4rem,1.2vw,0.55rem)',background:'#aa4a3a',color:'#fff8f0',border:'none',cursor:'pointer',fontFamily:'inherit'}}>← {t.back}</button>
            <h2 style={{color:'#ff7e00',fontSize:'clamp(0.5rem,1.5vw,0.8rem)',margin:0}}>{cmsTab === 'cards' ? t.manageCards : t.personalities}</h2>
          </header>
          
          {/* Tab Buttons */}
          <div style={{display:'flex',gap:'10px',marginBottom:'20px'}}>
            <button 
              onClick={()=>setCmsTab('cards')} 
              style={{padding:'12px 24px',fontSize:'clamp(0.45rem,1.3vw,0.55rem)',background:cmsTab==='cards'?MENU_COLORS.buttonGreen:MENU_COLORS.uiPanelDark,color:MENU_COLORS.textLight,border:`3px solid ${MENU_COLORS.grassDark}`,cursor:'pointer',fontFamily:'inherit'}}>
              {t.manageCards}
            </button>
            <button 
              onClick={()=>setCmsTab('thinkers')} 
              style={{padding:'12px 24px',fontSize:'clamp(0.45rem,1.3vw,0.55rem)',background:cmsTab==='thinkers'?MENU_COLORS.buttonGreen:MENU_COLORS.uiPanelDark,color:MENU_COLORS.textLight,border:`3px solid ${MENU_COLORS.grassDark}`,cursor:'pointer',fontFamily:'inherit'}}>
              {t.personalities}
            </button>
          </div>

          {cmsTab === 'cards' && (
          <div style={{display:'grid',gap:'clamp(15px,3vw,20px)'}}>
            {/* World Name Editor */}
            <div style={{background:MENU_COLORS.uiPanel,border:`3px solid ${MENU_COLORS.borderOrange}`,padding:'clamp(15px,3vw,20px)'}}>
              <h2 style={{fontSize:'clamp(0.5rem,1.8vw,0.7rem)',marginBottom:'15px',color:MENU_COLORS.accent}}>{t.database}</h2>
              <div style={{display:'flex',gap:'12px',alignItems:'center',flexWrap:'wrap'}}>
                <label style={{fontSize:'clamp(0.35rem,1vw,0.45rem)',color:MENU_COLORS.textLight}}>{t.name}:</label>
                <input 
                  type="text" 
                  value={worldName} 
                  onChange={e=>{setWorldName(e.target.value);localStorage.setItem('worldName',e.target.value);}} 
                  style={{flex:1,minWidth:'150px',padding:'8px',background:MENU_COLORS.inputBg,border:`2px solid ${MENU_COLORS.borderOrange}`,color:MENU_COLORS.textLight,fontSize:'clamp(0.35rem,1vw,0.45rem)',fontFamily:'inherit'}}
                />
              </div>
            </div>
            
            <div style={{background:MENU_COLORS.uiPanel,border:`3px solid ${MENU_COLORS.borderOrange}`,padding:'clamp(15px,3vw,20px)'}}>
              <h2 style={{fontSize:'clamp(0.5rem,1.8vw,0.7rem)',marginBottom:'15px',color:MENU_COLORS.accent}}>{t.newCard}</h2>
              <div style={{display:'grid',gap:'12px'}}>
                <div><label style={{display:'block',marginBottom:'6px',fontSize:'clamp(0.35rem,1vw,0.45rem)',color:MENU_COLORS.textLight}}>{t.question}:</label><textarea value={newCard.german} onChange={e=>setNewCard({...newCard,german:e.target.value})} rows={3} style={{width:'100%',padding:'8px',background:MENU_COLORS.inputBg,border:`2px solid ${MENU_COLORS.borderOrange}`,color:MENU_COLORS.textLight,fontSize:'clamp(0.35rem,1vw,0.45rem)',fontFamily:'inherit',resize:'vertical'}}/></div>
                <div><label style={{display:'block',marginBottom:'6px',fontSize:'clamp(0.35rem,1vw,0.45rem)',color:MENU_COLORS.textLight}}>{t.answer}:</label><textarea value={newCard.english} onChange={e=>setNewCard({...newCard,english:e.target.value})} rows={3} style={{width:'100%',padding:'8px',background:MENU_COLORS.inputBg,border:`2px solid ${MENU_COLORS.borderOrange}`,color:MENU_COLORS.textLight,fontSize:'clamp(0.35rem,1vw,0.45rem)',fontFamily:'inherit',resize:'vertical'}}/></div>
                <button onClick={saveCard} style={{padding:'10px 20px',fontSize:'clamp(0.45rem,1.3vw,0.55rem)',background:MENU_COLORS.buttonGreen,color:MENU_COLORS.textLight,border:`3px solid ${MENU_COLORS.grassDark}`,cursor:'pointer',fontFamily:'inherit',boxShadow:'0 4px 0 ' + MENU_COLORS.grassDark}}>{t.save}</button>
              </div>
            </div>
            
            <div style={{background:MENU_COLORS.uiPanel,border:`3px solid ${MENU_COLORS.borderOrange}`,padding:'clamp(15px,3vw,20px)',display:'flex',gap:'12px',justifyContent:'center',flexWrap:'wrap'}}>
              <button onClick={exportCSV} style={{padding:'12px 24px',fontSize:'clamp(0.45rem,1.3vw,0.55rem)',background:MENU_COLORS.buttonBlue,color:MENU_COLORS.textLight,border:`3px solid ${MENU_COLORS.roofBrown}`,cursor:'pointer',fontFamily:'inherit',boxShadow:'0 4px 0 #1A5276'}}>{t.exportCsv}</button>
              <label style={{display:'inline-block',padding:'12px 24px',fontSize:'clamp(0.45rem,1.3vw,0.55rem)',background:MENU_COLORS.buttonGreen,color:MENU_COLORS.textLight,border:`3px solid ${MENU_COLORS.grassDark}`,cursor:'pointer',fontFamily:'inherit',boxShadow:'0 4px 0 ' + MENU_COLORS.grassDark}}>
                {t.importCsv}
                <input type="file" accept=".csv" onChange={importCSV} style={{display:'none'}} />
              </label>
            </div>
            
            <div style={{background:MENU_COLORS.uiPanel,border:`3px solid ${MENU_COLORS.borderOrange}`,padding:'clamp(15px,3vw,20px)'}}>
              <h3 style={{fontSize:'clamp(0.5rem,1.8vw,0.7rem)',marginBottom:'15px',color:MENU_COLORS.accent}}>{t.allCards} ({vocabularyCards.length})</h3>
              <div style={{display:'grid',gap:'12px',maxHeight:'60vh',overflowY:'auto',WebkitOverflowScrolling:'touch',overscrollBehavior:'contain'}}>
                {vocabularyCards.map(card=>(
                  <div key={card.id} style={{padding:'12px',background:editingCard?.id===card.id?MENU_COLORS.buttonOrange:MENU_COLORS.cardBg,border:`2px solid ${MENU_COLORS.uiPanelDark}`}}>
                    {editingCard?.id===card.id?(
                      <div style={{display:'grid',gap:'8px'}}>
                        <textarea value={editingCard.german} onChange={e=>setEditingCard({...editingCard,german:e.target.value})} rows={3} style={{padding:'10px',background:MENU_COLORS.inputBg,border:`1px solid ${MENU_COLORS.borderThin}`,color:MENU_COLORS.textLight,fontSize:'clamp(0.4rem,1.2vw,0.5rem)',fontFamily:'inherit',width:'100%',minHeight:'60px'}}/>
                        <textarea value={editingCard.english} onChange={e=>setEditingCard({...editingCard,english:e.target.value})} rows={4} style={{padding:'10px',background:MENU_COLORS.inputBg,border:`1px solid ${MENU_COLORS.borderThin}`,color:MENU_COLORS.textLight,fontSize:'clamp(0.4rem,1.2vw,0.5rem)',fontFamily:'inherit',width:'100%',minHeight:'80px'}}/>
                        <div style={{display:'flex',gap:'8px'}}>
                          <button onClick={updateCard} style={{flex:1,padding:'8px',fontSize:'clamp(0.4rem,1.2vw,0.5rem)',background:MENU_COLORS.uiPanelDark,color:MENU_COLORS.textLight,border:`2px solid ${GBA_COLORS.black}`,cursor:'pointer',fontFamily:'inherit'}}>OK</button>
                          <button onClick={()=>setEditingCard(null)} style={{flex:1,padding:'8px',fontSize:'clamp(0.4rem,1.2vw,0.5rem)',background:GBA_COLORS.white,color:GBA_COLORS.black,border:`2px solid ${GBA_COLORS.black}`,cursor:'pointer',fontFamily:'inherit'}}>{t.cancel}</button>
                        </div>
                      </div>
                    ):(
                      <div>
                        <div style={{fontSize:'clamp(0.45rem,1.5vw,0.55rem)',color:MENU_COLORS.textLight,marginBottom:'6px',fontWeight:'bold'}}>{card.german.length>80?card.german.substring(0,80)+'...':card.german}</div>
                        <div style={{display:'flex',gap:'8px',marginTop:'8px'}}>
                          <button onClick={()=>setEditingCard(card)} style={{padding:'6px 12px',fontSize:'clamp(0.4rem,1.2vw,0.5rem)',background:MENU_COLORS.buttonGreen,color:MENU_COLORS.textLight,border:`2px solid ${MENU_COLORS.grassDark}`,cursor:'pointer',fontFamily:'inherit'}}>{t.edit}</button>
                          <button onClick={()=>deleteCard(card.id)} style={{padding:'6px 12px',fontSize:'clamp(0.4rem,1.2vw,0.5rem)',background:MENU_COLORS.buttonRed,color:MENU_COLORS.textLight,border:`2px solid ${MENU_COLORS.roofBrown}`,cursor:'pointer',fontFamily:'inherit'}}>{t.delete}</button>
                        </div>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </div>
          )}

          {cmsTab === 'thinkers' && (
          <div style={{display:'grid',gap:'clamp(15px,3vw,20px)'}}>
            <div style={{background:MENU_COLORS.uiPanel,border:`3px solid ${MENU_COLORS.borderOrange}`,padding:'clamp(15px,3vw,20px)'}}>
              <h2 style={{fontSize:'clamp(0.5rem,1.8vw,0.7rem)',marginBottom:'15px',color:MENU_COLORS.accent}}>{t.newPersonality}</h2>
              <div style={{display:'grid',gap:'12px'}}>
                <div><label style={{display:'block',marginBottom:'6px',fontSize:'clamp(0.35rem,1vw,0.45rem)',color:MENU_COLORS.textLight}}>{t.nameLabel}:</label><input value={newThinker.name} onChange={e=>setNewThinker({...newThinker,name:e.target.value})} style={{width:'100%',padding:'8px',background:MENU_COLORS.inputBg,border:`2px solid ${MENU_COLORS.borderOrange}`,color:MENU_COLORS.textLight,fontSize:'clamp(0.35rem,1vw,0.45rem)',fontFamily:'inherit'}}/></div>
                <div><label style={{display:'block',marginBottom:'6px',fontSize:'clamp(0.35rem,1vw,0.45rem)',color:MENU_COLORS.textLight}}>{t.textLabel}:</label><textarea value={newThinker.text} onChange={e=>setNewThinker({...newThinker,text:e.target.value})} rows={3} style={{width:'100%',padding:'8px',background:MENU_COLORS.inputBg,border:`2px solid ${MENU_COLORS.borderOrange}`,color:MENU_COLORS.textLight,fontSize:'clamp(0.35rem,1vw,0.45rem)',fontFamily:'inherit',resize:'vertical'}}/></div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}}>
                  <div>
                    <label style={{display:'block',marginBottom:'6px',fontSize:'clamp(0.35rem,1vw,0.45rem)',color:MENU_COLORS.textLight}}>GENDER:</label>
                    <select value={newThinker.gender} onChange={e=>setNewThinker({...newThinker,gender:e.target.value})} style={{width:'100%',padding:'8px',background:MENU_COLORS.inputBg,border:`2px solid ${MENU_COLORS.borderOrange}`,color:MENU_COLORS.textLight,fontSize:'clamp(0.35rem,1vw,0.45rem)',fontFamily:'inherit'}}>
                      <option value="Mann">M</option>
                      <option value="Frau">F</option>
                      <option value="Divers">D</option>
                    </select>
                  </div>
                  <div>
                    <label style={{display:'block',marginBottom:'6px',fontSize:'clamp(0.35rem,1vw,0.45rem)',color:MENU_COLORS.textLight}}>HAIR:</label>
                    <select value={newThinker.hair} onChange={e=>setNewThinker({...newThinker,hair:e.target.value})} style={{width:'100%',padding:'8px',background:MENU_COLORS.inputBg,border:`2px solid ${MENU_COLORS.borderOrange}`,color:MENU_COLORS.textLight,fontSize:'clamp(0.35rem,1vw,0.45rem)',fontFamily:'inherit'}}>
                      <option value="Schwarz">Black</option>
                      <option value="Braun">Brown</option>
                      <option value="Blond">Blond</option>
                      <option value="Weißgrau">Gray</option>
                      <option value="Rot">Red</option>
                    </select>
                  </div>
                </div>
                <button onClick={saveThinker} style={{padding:'10px 20px',fontSize:'clamp(0.45rem,1.3vw,0.55rem)',background:MENU_COLORS.buttonGreen,color:MENU_COLORS.textLight,border:`3px solid ${MENU_COLORS.grassDark}`,cursor:'pointer',fontFamily:'inherit',boxShadow:'0 4px 0 ' + MENU_COLORS.grassDark}}>{t.save}</button>
              </div>
            </div>
            
            <div style={{background:MENU_COLORS.uiPanel,border:`3px solid ${MENU_COLORS.borderOrange}`,padding:'clamp(15px,3vw,20px)',display:'flex',gap:'12px',justifyContent:'center',flexWrap:'wrap'}}>
              <button onClick={exportThinkersCSV} style={{padding:'12px 24px',fontSize:'clamp(0.45rem,1.3vw,0.55rem)',background:MENU_COLORS.buttonBlue,color:MENU_COLORS.textLight,border:`3px solid ${MENU_COLORS.roofBrown}`,cursor:'pointer',fontFamily:'inherit',boxShadow:'0 4px 0 #1A5276'}}>{t.exportCsv}</button>
              <label style={{display:'inline-block',padding:'12px 24px',fontSize:'clamp(0.45rem,1.3vw,0.55rem)',background:MENU_COLORS.buttonGreen,color:MENU_COLORS.textLight,border:`3px solid ${MENU_COLORS.grassDark}`,cursor:'pointer',fontFamily:'inherit',boxShadow:'0 4px 0 ' + MENU_COLORS.grassDark}}>
                {t.importCsv}
                <input type="file" accept=".csv" onChange={importThinkersCSV} style={{display:'none'}} />
              </label>
            </div>
            
            <div style={{background:MENU_COLORS.uiPanel,border:`3px solid ${MENU_COLORS.borderOrange}`,padding:'clamp(15px,3vw,20px)'}}>
              <h3 style={{fontSize:'clamp(0.5rem,1.8vw,0.7rem)',marginBottom:'15px',color:MENU_COLORS.accent}}>{t.allPersonalities} ({thinkers.length})</h3>
              <div style={{display:'grid',gap:'12px',maxHeight:'50vh',overflowY:'auto',WebkitOverflowScrolling:'touch',overscrollBehavior:'contain'}}>
                {thinkers.map((thinker, idx) => (
                  <div key={idx} style={{background:MENU_COLORS.houseWhite,border:`2px solid ${MENU_COLORS.roofBrown}`,padding:'12px'}}>
                    {editingThinker && editingThinker.name === thinker.name ? (
                      <div>
                        <div style={{marginBottom:'10px'}}><input value={editingThinker.name} onChange={e=>setEditingThinker({...editingThinker,name:e.target.value})} style={{width:'100%',padding:'6px',background:GBA_COLORS.white,border:`2px solid ${MENU_COLORS.roofBrown}`,fontSize:'clamp(0.35rem,1vw,0.45rem)',fontFamily:'inherit'}}/></div>
                        <div style={{marginBottom:'10px'}}><textarea value={editingThinker.text} onChange={e=>setEditingThinker({...editingThinker,text:e.target.value})} rows={3} style={{width:'100%',padding:'6px',background:GBA_COLORS.white,border:`2px solid ${MENU_COLORS.roofBrown}`,fontSize:'clamp(0.35rem,1vw,0.45rem)',fontFamily:'inherit',resize:'vertical'}}/></div>
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'10px'}}>
                          <select value={editingThinker.gender} onChange={e=>setEditingThinker({...editingThinker,gender:e.target.value})} style={{padding:'6px',background:GBA_COLORS.white,border:`2px solid ${MENU_COLORS.roofBrown}`,fontSize:'clamp(0.35rem,1vw,0.45rem)',fontFamily:'inherit'}}>
                            <option value="Mann">M</option>
                            <option value="Frau">F</option>
                            <option value="Divers">D</option>
                          </select>
                          <select value={editingThinker.hair} onChange={e=>setEditingThinker({...editingThinker,hair:e.target.value})} style={{padding:'6px',background:GBA_COLORS.white,border:`2px solid ${MENU_COLORS.roofBrown}`,fontSize:'clamp(0.35rem,1vw,0.45rem)',fontFamily:'inherit'}}>
                            <option value="Schwarz">Black</option>
                            <option value="Braun">Brown</option>
                            <option value="Blond">Blond</option>
                            <option value="Weißgrau">Gray</option>
                            <option value="Rot">Red</option>
                          </select>
                        </div>
                        <div style={{display:'flex',gap:'8px'}}>
                          <button onClick={updateThinker} style={{flex:1,padding:'8px',fontSize:'clamp(0.4rem,1.2vw,0.5rem)',background:MENU_COLORS.buttonGreen,color:MENU_COLORS.textLight,border:`2px solid ${MENU_COLORS.grassDark}`,cursor:'pointer',fontFamily:'inherit'}}>OK</button>
                          <button onClick={()=>setEditingThinker(null)} style={{flex:1,padding:'8px',fontSize:'clamp(0.4rem,1.2vw,0.5rem)',background:GBA_COLORS.white,color:GBA_COLORS.black,border:`2px solid ${GBA_COLORS.black}`,cursor:'pointer',fontFamily:'inherit'}}>{t.cancel}</button>
                        </div>
                      </div>
                    ):(
                      <div>
                        <div style={{fontSize:'clamp(0.45rem,1.5vw,0.55rem)',color:MENU_COLORS.textLight,marginBottom:'4px',fontWeight:'bold'}}>{thinker.name}</div>
                        <div style={{fontSize:'clamp(0.35rem,1vw,0.4rem)',color:MENU_COLORS.textMuted,marginBottom:'6px'}}>{thinker.text.length>100?thinker.text.substring(0,100)+'...':thinker.text}</div>
                        <div style={{fontSize:'clamp(0.3rem,0.9vw,0.38rem)',color:MENU_COLORS.textMuted,marginBottom:'8px',opacity:0.7}}>{thinker.gender || 'Mann'} • {thinker.hair || 'Braun'}</div>
                        <div style={{display:'flex',gap:'8px'}}>
                          <button onClick={()=>setEditingThinker(thinker)} style={{padding:'6px 12px',fontSize:'clamp(0.4rem,1.2vw,0.5rem)',background:MENU_COLORS.buttonGreen,color:MENU_COLORS.textLight,border:`2px solid ${MENU_COLORS.grassDark}`,cursor:'pointer',fontFamily:'inherit'}}>{t.edit}</button>
                          <button onClick={()=>deleteThinker(thinker.name)} style={{padding:'6px 12px',fontSize:'clamp(0.4rem,1.2vw,0.5rem)',background:MENU_COLORS.buttonRed,color:MENU_COLORS.textLight,border:`2px solid ${MENU_COLORS.roofBrown}`,cursor:'pointer',fontFamily:'inherit'}}>{t.delete}</button>
                        </div>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </div>
          )}
        </div>
      )}
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');*{image-rendering:pixelated;}button:hover{filter:brightness(1.1);}button:active{transform:translateY(2px);}input,textarea{font-family:'Press Start 2P',monospace!important;}`}</style>
    </div>
  );
};



ReactDOM.createRoot(document.getElementById('root')).render(<NeuroplantGame />);
  </script>
</body>
</html>
